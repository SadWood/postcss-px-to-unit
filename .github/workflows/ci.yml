name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pnpm 11 要求 Node >= 22.13；Node 18/20 矩阵使用仍支持这些版本的 pnpm 9，
        # 但全部都按提交的 pnpm-lock.yaml 做 frozen install，避免 CI 依赖漂移。
        include:
          - node-version: 18
            pnpm-version: 9.15.9
          - node-version: 20
            pnpm-version: 9.15.9
          - node-version: 22
            pnpm-version: 11.5.0
          - node-version: 24
            pnpm-version: 11.5.0
    name: test (node ${{ matrix.node-version }}, pnpm ${{ matrix.pnpm-version }})
    steps:
      - uses: actions/checkout@v4

      # 用 npm 而非 pnpm：pnpm 11 要求 Node >= 22.13，会让 Node 18/20 的矩阵项
      # 在安装阶段就失败。npm 随每个 Node 版本捆绑，必然兼容；测试本身与包管理器
      # 无关，本地开发仍用 pnpm（见 package.json packageManager 字段）。
      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm ${{ matrix.pnpm-version }}
        run: |
          corepack enable
          corepack prepare pnpm@${{ matrix.pnpm-version }} --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run type checks
        run: pnpm type-check
