name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 覆盖 engines 声明的每个受支持的 Node 主版本下限。
        node-version: [18, 20, 22, 24]
    name: test (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v4

      # 用 npm 而非 pnpm：pnpm 11 要求 Node >= 22.13，会让 Node 18/20 的矩阵项
      # 在安装阶段就失败。npm 随每个 Node 版本捆绑，必然兼容；测试本身与包管理器
      # 无关，本地开发仍用 pnpm（见 package.json packageManager 字段）。
      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
